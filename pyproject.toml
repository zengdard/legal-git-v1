[project]
name = "legal-git"
version = "1.0.0"
description = "Versioned legal-document engine: immutable versions, exact diffs, faithful hierarchy, REST API. Self-hostable for contracts, T&Cs and regulatory texts."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pg8000>=1.31",
  "prometheus-client>=0.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "benchmark: performance measurements (deselected by default; run with -m benchmark)",
]

[tool.setuptools]
packages = ["app"]
