name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C++ core (GoogleTests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: CMake configure + build + test
        run: |
          cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build
          ./core/build/core_tests

  python:
    name: Engine (pytest, PostgreSQL)
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legalgit
          POSTGRES_PASSWORD: legalgit
          POSTGRES_DB: legalgit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalgit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEGALGIT_PG_URL: postgresql+pg8000://legalgit:legalgit@localhost:5432/legalgit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (pybind11 module)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Build the C++ core and pybind11 module
        run: |
          cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (unused imports)
        run: |
          pip install ruff
          ruff check app tests --select F401,F811

      - name: Test
        run: pytest
